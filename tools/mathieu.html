<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathieu en 3D</title>
<!-- L'aperçu de Mathieu en 3D (js/mathieu.js), à part du film : il tourne sur lui-même, un curseur ouvre la bouche.
     python3 tools/serve.py, puis http://localhost:8940/tools/mathieu.html
     ?open=0.6 (la bouche) · ?turn=0.5 (un angle fixe, sans tourner) · ?t=3 (un temps fixe, pour les essais) · ?arrivee (il arrive de loin, en boucle) -->
<style>
html,body{margin:0;height:100%;background:#DADBD8;color:#222428;overflow:hidden;font:15px system-ui}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(560px,calc(100vw - 32px));z-index:2}
.ui label{display:flex;gap:8px;align-items:center;flex:1 1 220px}
.ui input{flex:1}
.ui button{font:inherit;background:none;border:2px solid #222428;border-radius:18px;padding:5px 12px;color:inherit;cursor:pointer}
.ui button.on{background:#222428;color:#DADBD8}
</style>
</head>
<body>
<canvas id="obj"></canvas>
<div class="ui">
  <label>Bouche <input id="open" type="range" min="0" max="1" step="0.01" value="0"></label>
  <button id="spin" class="on">Tourne</button>
  <button id="bible">Bouche biblique</button>
  <button id="arr">Arrivée</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/objects3d.js"></script>
<script src="../js/mathieu.js"></script>
<script>
(() => {
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
Obj3D.init($('obj'));
let W = 1, Hh = 1; const size = () => { W = document.documentElement.clientWidth; Hh = innerHeight; Obj3D.resize(W, Hh); }; size(); addEventListener('resize', size);
const m = Mathieu.create();
let spin = !q.has('turn'), openT = +(q.get('open') || 0), open = openT, arr = q.has('arrivee') ? 0 : -1, turn = +(q.get('turn') || 0), bible = -1;
$('open').value = openT;
$('open').oninput = e => { openT = +e.target.value; bible = -1; };
$('spin').onclick = () => { spin = !spin; $('spin').classList.toggle('on', spin); };
$('bible').onclick = () => { bible = 0; };
$('arr').onclick = () => { arr = 0; };
// glisser : le faire tourner à la main
let drag = null; $('obj').onpointerdown = e => { drag = e.clientX; spin = false; $('spin').classList.remove('on'); };
addEventListener('pointermove', e => { if (drag !== null) { turn += (e.clientX - drag) * 0.01; drag = e.clientX; } });
addEventListener('pointerup', () => { drag = null; });
let last = performance.now(), t = 0, blinkAt = 2;
const lerpY = (k, b, s) => (Hh - 80) * (0.3 + 0.2 * k) - 2.8 * s / Mathieu.H * k + b * s * 0.12;
const sm = v => { v = Math.max(0, Math.min(1, v)); return v * v * (3 - 2 * v); };
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t = q.has('t') ? +q.get('t') : t + dt;
  const base = Math.min(W * 0.9, (Hh - 80) * 1.05);
  // la figure va de 8 unités au-dessus de la racine (les pics) à 13,6 en dessous (le bas du buste) : on la centre
  const yOf = s => (Hh - 80) / 2 - 2.8 * s / Mathieu.H;
  let s = base, x = W / 2, y = yOf(base), tr = turn, op = openT;
  if (spin) tr = turn = turn + dt * 0.9;
  // l'arrivée : minuscule au loin, il grossit en tournant (un tour et demi qui ralentit), se pose, puis la bouche biblique
  if (arr >= 0) {
    arr += dt; const k = sm(arr / 2.5), b = sm((arr - 3.2) / 1.6);
    s = base * (0.04 + 0.66 * k + 1.6 * b); y = lerpY(k, b, s); tr = (1 - k) * Math.PI * 3; op = b;
    if (arr > 7) arr = q.has('arrivee') ? 0 : -1;
  }
  if (bible >= 0) { bible += dt; op = openT = Math.min(1, bible / 1.2); $('open').value = op; if (bible > 1.2) bible = -1; }
  open += (op - open) * Math.min(1, dt * 10); if (q.has('t')) open = op;
  // la vie : il respire, il cligne
  const blink = t > blinkAt ? Math.max(0, 1 - Math.abs(t - blinkAt - 0.08) / 0.08) : 0; if (t > blinkAt + 0.2) blinkAt = t + 2.5 + Math.random() * 3;
  Mathieu.pose(m, { x, y: y + Math.sin(t * 1.6) * s * 0.004, s, turn: tr, tilt: 0.06, open, blink: q.has('t') ? 0 : blink, nod: Math.sin(t * 0.8) * 0.03 });
  Obj3D.render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
