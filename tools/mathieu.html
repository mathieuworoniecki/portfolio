<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathieu en 3D</title>
<!-- L'aperçu de Mathieu en 3D (js/mathieu.js), à part du film : il se balance de trois quarts en trois quarts, un curseur ouvre la bouche.
     python3 tools/serve.py, puis http://localhost:8940/tools/mathieu.html
     les images : media/mathieu/ (tools/mathieu/build.py) · ?open=0.6 (la bouche) · ?turn=0.5 (un angle fixe, sans tourner) · ?t=3 (un temps fixe, pour les essais) · ?arrivee (il arrive de loin, en boucle) · ?logo (la tête seule, en petit, comme dans l'en-tête) -->
<style>
html,body{margin:0;height:100%;background:#DADBD8;color:#222428;overflow:hidden;font:15px system-ui}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(560px,calc(100vw - 32px));z-index:2}
.ui label{display:flex;gap:8px;align-items:center;flex:1 1 220px}
.ui input{flex:1}
.ui button{font:inherit;background:none;border:2px solid #222428;border-radius:18px;padding:5px 12px;color:inherit;cursor:pointer}
.ui button.on{background:#222428;color:#DADBD8}
#etat{position:fixed;left:16px;right:16px;top:40%;text-align:center;z-index:3;line-height:1.4}
#etat img{display:block;max-width:100%;margin:12px auto 0;border-radius:8px}
</style>
</head>
<body>
<canvas id="obj"></canvas>
<div id="etat">Chargement de Mathieu…</div>
<div class="ui">
  <label>Bouche <input id="open" type="range" min="0" max="1" step="0.01" value="0"></label>
  <button id="spin" class="on">Tourne</button>
  <button id="bible">Bouche biblique</button>
  <button id="arr">Arrivée</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/objects3d.js"></script>
<script src="../js/mathieu.js"></script>
<script>
(() => {
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
// si la 3D ne marche pas ici (pas de WebGL, une erreur) : le dire, et montrer des captures s'il y en a (window.MATHIEU_CAPTURES)
const panne = why => { const e = $('etat'); e.style.top = '16px'; e.textContent = 'La 3D ne démarre pas sur cet appareil (' + why + ').'; if (window.MATHIEU_CAPTURES) { const i = new Image(); i.src = MATHIEU_CAPTURES; i.alt = 'Mathieu en 3D, sous plusieurs angles'; e.appendChild(i); } };
addEventListener('error', e => panne(e.message || 'erreur'));
if (!window.THREE || !window.Obj3D || !window.Mathieu) { panne(window.THREE ? 'erreur de chargement' : 'three.js ne s\'est pas chargé'); return; }
Obj3D.init($('obj'));
if (!Obj3D.ok) { panne('WebGL indisponible'); return; }
let W = 1, Hh = 1; const size = () => { W = document.documentElement.clientWidth; Hh = innerHeight; Obj3D.resize(W, Hh); }; size(); addEventListener('resize', size);
const logo = q.has('logo'), m = Mathieu.create({ logo }); if (logo) document.querySelector('.ui').style.display = 'none';
let spin = !q.has('turn'), openT = +(q.get('open') || 0), open = openT, arr = q.has('arrivee') ? 0 : -1, turn = +(q.get('turn') || 0), bible = -1;
$('open').value = openT;
$('open').oninput = e => { openT = +e.target.value; bible = -1; };
$('spin').onclick = () => { spin = !spin; $('spin').classList.toggle('on', spin); };
$('bible').onclick = () => { bible = 0; };
$('arr').onclick = () => { arr = 0; };
// glisser : le faire tourner à la main
let drag = null; $('obj').onpointerdown = e => { drag = e.clientX; spin = false; $('spin').classList.remove('on'); };
addEventListener('pointermove', e => { if (drag !== null) { turn += (e.clientX - drag) * 0.01; drag = e.clientX; } });
addEventListener('pointerup', () => { drag = null; });
let last = performance.now(), t = 0, sw = 0;
const sm = v => { v = Math.max(0, Math.min(1, v)); return v * v * (3 - 2 * v); };
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t = q.has('t') ? +q.get('t') : t + dt;
  const base = Math.min(W * 0.98, (Hh - 80) * 1.0), hx = m.meta ? m.meta.head[0] : 0.516, hy = m.meta ? m.meta.head[1] : 0.336;
  // le cadre (des cheveux au bas du buste) est centré ; la racine est le centre de la tête
  const yOf = s => (Hh - 80) / 2 - (0.5 - hy) * s;
  let s = base, x = W / 2 + (hx - 0.5) * base, y = yOf(base), tr = turn, op = openT;
  // il se balance de trois quarts en trois quarts (le relief vient d'une photo de face : de profil, il s'aplatit)
  if (spin) { sw += dt; tr = turn = Math.sin(sw * 0.7) * 0.75; }
  // l'arrivée : minuscule au loin, il grossit en tournant (un tour et demi qui ralentit), se pose, puis la bouche biblique
  if (arr >= 0) {
    arr += dt; const k = sm(arr / 2.5), b = sm((arr - 3.2) / 1.6);
    s = base * (0.04 + 0.66 * k + 1.6 * b); y = Hh * 0.3 + (yOf(s) - Hh * 0.3) * k + b * s * 0.1; x = W / 2 + (hx - 0.5) * s; tr = (1 - k) * Math.PI * 3; op = b;
    if (arr > 7) arr = q.has('arrivee') ? 0 : -1;
  }
  if (bible >= 0) { bible += dt; op = openT = Math.min(1, bible / 1.2); $('open').value = op; if (bible > 1.2) bible = -1; }
  open += (op - open) * Math.min(1, dt * 10); if (q.has('t')) open = op;
  // le logo : la tête seule, petite, en haut à gauche, qui tourne
  if (logo) { s = +(q.get('logo') || 56); x = 16 + s * 0.45; y = 16 + s * (m.meta ? m.meta.head[1] : 0.4); }
  // la vie : il respire
  Mathieu.pose(m, { x, y: y + Math.sin(t * 1.6) * s * 0.004, s, turn: tr, tilt: 0.06, open, nod: Math.sin(t * 0.8) * 0.03 });
  if (m.ready && $('etat').textContent.startsWith('Chargement')) $('etat').hidden = true;
  Obj3D.render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
