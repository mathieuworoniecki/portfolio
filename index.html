<!-- le fond : papier, quadrillage (fixe, derrière tout) -->
<div id="stage" aria-hidden="true">
  <canvas id="grid"></canvas>
</div>
<!-- les objets 3D en traits (js/objects3d.js), puis la craie : titres et dessins des scènes (js/titles.js, js/chalk.js) -->
<canvas id="obj" aria-hidden="true"></canvas>
<canvas id="titles" aria-hidden="true"></canvas>
<div class="sheet" aria-hidden="true"></div>

<!-- le grain de la craie, pour les dessins en SVG (cadres, accès) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="chalk-rough"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></defs></svg>

<!-- l'en-tête : le nom (en attendant le logo), le thème au centre, la langue à droite -->
<header class="top">
  <a class="brand" href="#" id="brand" aria-label="Mathieu, retour au début" data-i18n-attr="aria-label:home">Mathieu</a>
  <div class="picks"><div class="pick" id="lang-pick"></div></div>
  <div class="tpick" id="theme-pick"></div>
</header>

<!-- les scènes : une par plage de la ligne du temps (js/scenes.js) ; leurs titres sont écrits à la craie -->
<main class="scenes">
  <section class="scene" data-scene="salut">
    <h1 data-title data-ink="pen" data-plafond data-i18n="salut.title">Salut, moi c’est Mathieu.</h1>
    <!-- deux boutons : rester jouer avec les chats (le texte s'efface, le bouton d'entrée monte en haut de l'écran), ou entrer -->
    <div class="ctas">
      <button type="button" class="cta cta-jeu" id="stay" data-plafond data-i18n="salut.stay">Mode sérieux</button>
      <button type="button" class="cta" id="enter" data-plafond data-i18n="salut.cta">Entrer dans mon univers</button>
    </div>
  </section>
  <!-- l'écran 2 : l'espace (js/trounoir.js) -->
  <section class="scene" data-scene="espace"></section>
</main>

<!-- les phrases de la ligne du temps, lettre à lettre -->
<div id="caps" aria-hidden="true"></div>

<!-- la barre du film : lecture, rejouer, son ; les chapitres -->
<div class="film-ui">
  <div class="ctrl">
    <button type="button" class="btn" id="pp"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path class="ic-pause" d="M3.5 2v8M8.5 2v8"/><path class="ic-play" d="M3 1.8v8.4L10 6z"/></svg><span class="t">Pause</span></button>
    <button type="button" class="btn" id="rst"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 6a3.8 3.8 0 1 0 1.2-2.8M2.2 1.6v2.1h2.1"/></svg><span class="t" data-i18n="film.replay">Rejouer</span></button>
    <button type="button" class="btn" id="snd" aria-pressed="false"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 4.3h2L6.3 2v8L3.5 7.7h-2z"/><path class="ic-on" d="M8.2 4a2.8 2.8 0 0 1 0 4M9.7 2.6a4.8 4.8 0 0 1 0 6.8"/><path class="ic-off" d="M8.2 4.4l3 3M11.2 4.4l-3 3"/></svg><span class="t" data-i18n="film.sound">Son</span></button>

  <nav id="chap" aria-label="Chapitres" data-i18n-attr="aria-label:film.chapters"></nav>
</div>
